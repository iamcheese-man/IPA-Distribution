<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZZIacmls IPA Repo</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --card2: #1d222b;
      --text: #f3f5f7;
      --muted: #a7b0be;
      --accent: #4f8cff;
      --accent2: #3a73dc;
      --border: #2a3140;
      --danger: #ff5d73;
      --success: #4ade80;
      --shadow: 0 10px 30px rgba(0,0,0,0.25);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #0d1015, #11141b 35%, #0f1115 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100%;
    }

    body {
      padding: 18px;
      padding-top: max(18px, env(safe-area-inset-top));
      padding-bottom: max(18px, env(safe-area-inset-bottom));
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }

    .hero {
      background: linear-gradient(135deg, #171b24, #12151c);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .title {
      font-size: 1.9rem;
      font-weight: 800;
      margin: 0 0 6px;
      letter-spacing: -0.03em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.98rem;
      margin: 0 0 18px;
      line-height: 1.5;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .search {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,140,255,0.15);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .pill {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 0.92rem;
    }

    .grid {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .card {
      background: linear-gradient(180deg, var(--card), var(--card2));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .app-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .app-name {
      font-size: 1.12rem;
      font-weight: 750;
      line-height: 1.35;
      word-break: break-word;
      margin: 0 0 6px;
    }

    .app-meta {
      color: var(--muted);
      font-size: 0.9rem;
      word-break: break-all;
    }

    .tag {
      font-size: 0.78rem;
      border: 1px solid var(--border);
      background: rgba(79,140,255,0.10);
      color: #bdd2ff;
      padding: 7px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    button, a.btn {
      appearance: none;
      border: none;
      outline: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.15s ease, background 0.15s ease;
    }

    button:active, a.btn:active {
      transform: scale(0.98);
    }

    .primary {
      background: var(--accent);
      color: white;
    }

    .primary:hover {
      background: var(--accent2);
    }

    .secondary {
      background: rgba(255,255,255,0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .secondary:hover {
      background: rgba(255,255,255,0.08);
    }

    .ghost {
      background: transparent;
      color: var(--muted);
      border: 1px dashed var(--border);
    }

    .ghost:hover {
      background: rgba(255,255,255,0.03);
      color: var(--text);
    }

    .footer {
      color: var(--muted);
      text-align: center;
      font-size: 0.88rem;
      margin-top: 24px;
      padding-bottom: 12px;
    }

    .empty, .loading, .error {
      padding: 22px;
      text-align: center;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--card), var(--card2));
      box-shadow: var(--shadow);
      color: var(--muted);
    }

    .error {
      color: #ffd0d6;
      border-color: rgba(255,93,115,0.25);
    }

    .small {
      font-size: 0.84rem;
      opacity: 0.92;
      margin-top: 10px;
      line-height: 1.5;
    }

    @media (min-width: 700px) {
      .controls {
        grid-template-columns: 1fr auto auto;
        align-items: center;
      }
      .search {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1 class="title">ZZIacmls IPA Repo</h1>
      <p class="subtitle">
        Flat IPA library hosted with GitHub Pages + Google Drive links.
        Browse, search, copy links, and open files directly.
      </p>

      <div class="controls">
        <input id="search" class="search" type="text" placeholder="Search IPA files..." />
        <button class="secondary" id="refreshBtn">Refresh</button>
        <button class="ghost" id="copyRepoBtn">Copy Repo URL</button>
      </div>

      <div class="stats">
        <div class="pill" id="countPill">Loading…</div>
        <div class="pill" id="jsonPill">Source: ipalist.json</div>
      </div>
    </section>

    <div id="status" class="loading">Loading repo index…</div>
    <div id="list" class="grid" style="display:none;"></div>

    <div class="footer">
      ZZIacmlsSourceRepo · Static GitHub Pages IPA browser
    </div>
  </div>

  <script>
    const JSON_PATH = "ipalist.json";
    const listEl = document.getElementById("list");
    const statusEl = document.getElementById("status");
    const countPill = document.getElementById("countPill");
    const searchEl = document.getElementById("search");
    const refreshBtn = document.getElementById("refreshBtn");
    const copyRepoBtn = document.getElementById("copyRepoBtn");

    let apps = [];
    let filtered = [];

    function prettyName(filename) {
      return filename
        .replace(/\.ipa$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function (m) {
        return ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#039;"
        })[m];
      });
    }

    function render(items) {
      if (!items.length) {
        listEl.style.display = "none";
        statusEl.style.display = "block";
        statusEl.className = "empty";
        statusEl.innerHTML = "No matching IPA files found.";
        countPill.textContent = `0 apps shown`;
        return;
      }

      statusEl.style.display = "none";
      listEl.style.display = "grid";
      countPill.textContent = `${items.length} app${items.length === 1 ? "" : "s"} shown`;

      listEl.innerHTML = items.map(app => {
        const rawName = app.name || "Unnamed.ipa";
        const displayName = prettyName(rawName);
        const url = app.url || "#";
        const id = app.id || "";
        const encodedURL = encodeURIComponent(url);

        return `
          <article class="card">
            <div class="app-top">
              <div>
                <h2 class="app-name">${escapeHtml(displayName)}</h2>
                <div class="app-meta">${escapeHtml(rawName)}</div>
                <div class="app-meta small">Drive ID: ${escapeHtml(id)}</div>
              </div>
              <div class="tag">IPA</div>
            </div>

            <div class="actions">
              <a class="btn primary" href="${url}" target="_blank" rel="noopener noreferrer">Open / Download</a>
              <button class="secondary" onclick="copyText('${url.replace(/'/g, "\\'")}')">Copy Link</button>
              <button class="ghost" onclick="copyText('${rawName.replace(/'/g, "\\'")}')">Copy Name</button>
            </div>
          </article>
        `;
      }).join("");
    }

    async function loadApps() {
      try {
        statusEl.style.display = "block";
        statusEl.className = "loading";
        statusEl.textContent = "Loading repo index…";
        listEl.style.display = "none";

        const res = await fetch(JSON_PATH + "?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("Failed to fetch JSON: " + res.status);

        const data = await res.json();
        if (!Array.isArray(data)) throw new Error("JSON root is not an array.");

        apps = data
          .filter(x => x && typeof x === "object" && x.name && x.url)
          .sort((a, b) => a.name.localeCompare(b.name));

        filtered = [...apps];
        render(filtered);
      } catch (err) {
        console.error(err);
        listEl.style.display = "none";
        statusEl.style.display = "block";
        statusEl.className = "error";
        statusEl.innerHTML = `
          <strong>Failed to load ipalist.json</strong>
          <div class="small">${escapeHtml(String(err.message || err))}</div>
          <div class="small">Make sure <code>index.html</code> and <code>ipalist.json</code> are in the same GitHub Pages folder.</div>
        `;
        countPill.textContent = "Load failed";
      }
    }

    function filterApps(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        filtered = [...apps];
      } else {
        filtered = apps.filter(app =>
          (app.name || "").toLowerCase().includes(q) ||
          (app.id || "").toLowerCase().includes(q)
        );
      }
      render(filtered);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        toast("Copied");
      } catch {
        prompt("Copy this:", text);
      }
    }

    function toast(msg) {
      const t = document.createElement("div");
      t.textContent = msg;
      t.style.position = "fixed";
      t.style.left = "50%";
      t.style.bottom = "28px";
      t.style.transform = "translateX(-50%)";
      t.style.background = "rgba(20,22,28,0.95)";
      t.style.border = "1px solid rgba(255,255,255,0.08)";
      t.style.color = "#fff";
      t.style.padding = "12px 16px";
      t.style.borderRadius = "999px";
      t.style.zIndex = "9999";
      t.style.boxShadow = "0 10px 30px rgba(0,0,0,0.35)";
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 1400);
    }

    searchEl.addEventListener("input", e => filterApps(e.target.value));
    refreshBtn.addEventListener("click", loadApps);
    copyRepoBtn.addEventListener("click", () => copyText(location.href));

    loadApps();
    window.copyText = copyText;
  </script>
</body>
</html>
